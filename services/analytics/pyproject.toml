[project]
name = "decisionos-analytics"
version = "0.1.0"
description = "DecisionOS bounded analytics workers: parsing, profiling, grain proof, plan compilation, metric execution."
requires-python = ">=3.12"
dependencies = [
  "polars>=1.16",
  "pydantic>=2.9",
  "fastapi>=0.115",
  "uvicorn>=0.32",
  "statsforecast>=2.1",
  "tqdm>=4.66",
  "pytz>=2024.1",
  "python-dateutil>=2.9",
  "scipy>=1.14",
  "scikit-learn>=1.5",
  # imported directly by the runtime modules; previously only present in the
  # developer venv, which made a clean install (CI / Docker) unable to collect tests
  "numpy>=1.26",
  "pandas>=2.2",
  "pulp>=2.9,<4",  # pulp 4.x removed the LpStatus* constants this module uses
  "simpy>=4.1",
  "pm4py>=2.7",
  "PyJWT[crypto]>=2.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "httpx>=0.28"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
  "ignore::DeprecationWarning",
  "ignore::PendingDeprecationWarning",
  "ignore::FutureWarning",
  "ignore:.*Using `httpx` with `starlette.testclient`.*",
  "ignore:invalid value encountered in divide:RuntimeWarning",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["decisionos_analytics*"]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = [
  "F401", "F841", "F821",
  "I001",
  "UP017", "UP035", "UP037",
  "RUF015", "RUF023", "RUF046", "RUF059",
  "BLE001", "DTZ005", "SIM102", "SIM103",
]
