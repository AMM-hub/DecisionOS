name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/analytics
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/analytics/pyproject.toml

      - name: Install package and test tools
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install ruff pytest-cov

      - name: Lint
        run: ruff check decisionos_analytics --output-format=github

      - name: Test
        run: pytest tests -q --cov=decisionos_analytics --cov-fail-under=85

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npx nuxt typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  e2e:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Build images
        run: docker compose build

      - name: Start stack
        run: docker compose up -d --wait

      - name: Wait for api and web
        run: |
          for i in $(seq 1 60); do
            if curl -s -o /dev/null http://127.0.0.1:8100/v1/health \
              && curl -s -o /dev/null http://127.0.0.1:3000/; then
              echo "stack reachable after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "stack did not become reachable within 60s"
          exit 1

      - name: UI audit sweep
        run: CHROME_PATH=/usr/bin/google-chrome WEB_BASE_URL=http://127.0.0.1:3000 node scripts/ui_audit.mjs

      - name: Dump compose logs
        if: failure()
        run: docker compose logs --tail=200

      - name: Upload audit artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-audit
          path: var/ui_audit/
          retention-days: 7

      - name: Stop stack
        if: always()
        run: docker compose down -v
