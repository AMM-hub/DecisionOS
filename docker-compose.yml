name: decisionos

services:
  api:
    build:
      context: ./services/analytics
    ports:
      - "8100:8100"
    volumes:
      - ./var:/app/var
    env_file:
      - path: .env
        required: false
    environment:
      DECISIONOS_DATA_DIR: /app/var/worker

  web:
    build:
      context: ./apps/web
    ports:
      - "3000:3000"
    environment:
      NUXT_PUBLIC_API_BASE: http://localhost:8100/v1
    depends_on:
      - api

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    profiles: ["auth"]
    command: ["start-dev", "--import-realm"]
    ports:
      - "8081:8080"
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-decisionos-admin}
      KC_HEALTH_ENABLED: "true"
    volumes:
      - ./infra/keycloak:/opt/keycloak/data/import:ro
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000 &&
          printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          grep -q 'UP' <&3
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
